<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500">
<rect x="0" y="0" width="100%" height="100%" fill="#f8fafc"/>

<style>
.title { font: 700 52px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.label { font: 700 34px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.body { font: 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#111827; }
.code { font: 40px 'Consolas', 'Cascadia Mono', monospace; fill:#111827; }
.note { font: 700 31px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#065f46; }
.warn { font: 700 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#9a3412; }
</style>

<text x="80" y="90" class="title">重编译（Re-compilation）字节码变化示意</text>
<rect x="80" y="160" width="1180" height="1120" rx="14" ry="14" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
<text x="120" y="220" class="label">改造前：原始 JAR 中 Foo.class（JDK 8 编译）</text>
<rect x="110" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="140" y="310" class="code">Classfile /app/lib-a-1.2.0.jar!/com/demo/Foo.class</text>
<text x="140" y="354" class="code">public int sum(int a, int b);</text>
<text x="140" y="398" class="code">  Code:</text>
<text x="140" y="442" class="code">   0: iload_1</text>
<text x="140" y="486" class="code">   1: iload_2</text>
<text x="140" y="530" class="code">   2: iadd</text>
<text x="140" y="574" class="code">   3: ireturn</text>
<text x="140" y="618" class="code"></text>
<text x="140" y="662" class="code">public java.lang.String greet(java.lang.String n);</text>
<text x="140" y="706" class="code">  Code:</text>
<text x="140" y="750" class="code">   0: new           #2  // StringBuilder</text>
<text x="140" y="794" class="code">   3: dup</text>
<text x="140" y="838" class="code">   4: invokespecial #3  // &lt;init&gt;</text>
<text x="140" y="882" class="code">   7: ldc           #4  // "hello,"</text>
<text x="140" y="926" class="code">   9: invokevirtual #5  // append</text>
<text x="140" y="970" class="code">  12: aload_1</text>
<text x="140" y="1014" class="code">  13: invokevirtual #5  // append</text>
<text x="140" y="1058" class="code">  16: invokevirtual #6  // toString</text>
<text x="140" y="1102" class="code">  19: areturn</text>
<text x="140" y="1146" class="code"></text>
<text x="140" y="1190" class="code">环境特征：常量池索引、StackMapTable、局部变量表由环境 A 生成</text>
<rect x="1330" y="300" width="340" height="820" rx="14" ry="14" fill="#ecfeff" stroke="#334155" stroke-width="2"/>
<text x="1382" y="370" class="label">重编译动作</text>
<text x="1354" y="450" class="body">- JDK 8 -&gt; JDK 17/21</text>
<text x="1354" y="520" class="body">- 编译器/插件版本变化</text>
<text x="1354" y="590" class="body">- 调试信息与优化策略变化</text>
<text x="1354" y="660" class="body">- 重新生成 StackMapTable 与常量池</text>
<text x="1354" y="730" class="body">- 业务源码未改动</text>
<line x1="1260" y1="720" x2="1330" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1330,720 1306,707 1306,733" fill="#0f172a"/>
<line x1="1670" y1="720" x2="1740" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1740,720 1716,707 1716,733" fill="#0f172a"/>
<rect x="1740" y="160" width="1180" height="1120" rx="14" ry="14" fill="#f0fdf4" stroke="#334155" stroke-width="2"/>
<text x="1780" y="220" class="label">改造后：重编译产物 Foo.class（JDK 21）</text>
<rect x="1770" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="1800" y="310" class="code">Classfile /app/lib-a-rebuild.jar!/com/demo/Foo.class</text>
<text x="1800" y="354" class="code">public int sum(int a, int b);</text>
<text x="1800" y="398" class="code">  Code:</text>
<text x="1800" y="442" class="code">   0: iload_1</text>
<text x="1800" y="486" class="code">   1: iload_2</text>
<text x="1800" y="530" class="code">   2: iadd</text>
<text x="1800" y="574" class="code">   3: ireturn   // 语义一致</text>
<text x="1800" y="618" class="code"></text>
<text x="1800" y="662" class="code">public java.lang.String greet(java.lang.String n);</text>
<text x="1800" y="706" class="code">  Code:</text>
<text x="1800" y="750" class="code">   0: aload_1</text>
<text x="1800" y="794" class="code">   1: invokestatic  #7  // String.valueOf</text>
<text x="1800" y="838" class="code">   4: invokedynamic #8  // makeConcatWithConstants</text>
<text x="1800" y="882" class="code">   9: areturn</text>
<text x="1800" y="926" class="code"></text>
<text x="1800" y="970" class="code">差异来源：编译策略变化（字符串拼接实现、常量池索引、调试元信息）</text>
<text x="1800" y="1014" class="code">功能结论：行为等价，但字节码表示已变化</text>
<text x="80" y="1430" class="note">结论：重编译会引入非语义差异；扫描应做跨编译环境稳健匹配，不能只靠二进制指纹。</text>
</svg>