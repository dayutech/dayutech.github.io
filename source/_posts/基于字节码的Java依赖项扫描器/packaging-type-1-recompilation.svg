<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500">
<rect x="0" y="0" width="100%" height="100%" fill="#f8fafc"/>

<style>
.title { font: 700 52px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.label { font: 700 34px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.body { font: 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#111827; }
.code { font: 40px 'Consolas', 'Cascadia Mono', monospace; fill:#111827; }
.note { font: 700 31px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#065f46; }
.warn { font: 700 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#9a3412; }
</style>

<text x="80" y="90" class="title">重编译（Re-compilation）字节码变化示意</text>
<rect x="80" y="132" width="2840" height="110" rx="14" ry="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="120" y="190" class="label">同一份源码：String greet(String n) { return "hello," + n; }</text>
<text x="120" y="228" class="warn">说明：左右不是两个不同方法，而是相同源码在不同 JDK 下的编译结果。</text>
<rect x="80" y="280" width="1180" height="1000" rx="14" ry="14" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
<text x="120" y="340" class="label">改造前：原始 JAR 中 Foo.class（JDK 8 编译）</text>
<rect x="110" y="360" width="1120" height="890" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="140" y="430" class="code">Classfile /app/lib-a-1.2.0.jar!/com/demo/Foo.class</text>
<text x="140" y="518" class="code">public java.lang.String greet(java.lang.String n);</text>
<text x="140" y="562" class="code">  Code:</text>
<text x="140" y="606" class="code">   0: new           #2  // StringBuilder</text>
<text x="140" y="650" class="code">   3: dup</text>
<text x="140" y="694" class="code">   4: invokespecial #3  // &lt;init&gt;</text>
<text x="140" y="738" class="code">   7: ldc           #4  // "hello,"</text>
<text x="140" y="782" class="code">   9: invokevirtual #5  // append</text>
<text x="140" y="826" class="code">  12: aload_1</text>
<text x="140" y="870" class="code">  13: invokevirtual #5  // append</text>
<text x="140" y="914" class="code">  16: invokevirtual #6  // toString</text>
<text x="140" y="958" class="code">  19: areturn</text>
<rect x="1330" y="300" width="340" height="820" rx="14" ry="14" fill="#ecfeff" stroke="#334155" stroke-width="2"/>
<text x="1382" y="370" class="label">重编译动作</text>
<text x="1354" y="450" class="body">- JDK 8 -&gt; JDK 17/21</text>
<text x="1354" y="520" class="body">- 编译器/插件版本变化</text>
<text x="1354" y="590" class="body">- 调试信息与优化策略变化</text>
<text x="1354" y="660" class="body">- 重新生成 StackMapTable 与常量池</text>
<text x="1354" y="730" class="body">- 业务源码未改动</text>
<line x1="1260" y1="720" x2="1330" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1330,720 1306,707 1306,733" fill="#0f172a"/>
<line x1="1670" y1="720" x2="1740" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1740,720 1716,707 1716,733" fill="#0f172a"/>
<rect x="1740" y="280" width="1180" height="1000" rx="14" ry="14" fill="#f0fdf4" stroke="#334155" stroke-width="2"/>
<text x="1780" y="340" class="label">改造后：重编译产物 Foo.class（JDK 21）</text>
<rect x="1770" y="360" width="1120" height="890" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="1800" y="430" class="code">Classfile /app/lib-a-rebuild.jar!/com/demo/Foo.class</text>
<text x="1800" y="518" class="code">public java.lang.String greet(java.lang.String n);</text>
<text x="1800" y="562" class="code">  Code:</text>
<text x="1800" y="606" class="code">   0: aload_1</text>
<text x="1800" y="650" class="code">   1: invokestatic  #7  // String.valueOf</text>
<text x="1800" y="694" class="code">   4: invokedynamic #8  // makeConcatWithConstants</text>
<text x="1800" y="738" class="code">   9: areturn</text>
<text x="1800" y="782" class="code"></text>
<text x="1800" y="826" class="code">差异来源：字符串拼接编译策略、常量池索引、调试元信息</text>
<text x="1800" y="870" class="code">功能结论：同一源码，行为等价，但字节码表示已变化</text>
<text x="80" y="1430" class="note">结论：重编译会引入非语义差异；扫描应做跨编译环境稳健匹配，不能只靠二进制指纹。</text>
</svg>
