<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500">
<rect x="0" y="0" width="100%" height="100%" fill="#f8fafc"/>

<style>
.title { font: 700 52px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.label { font: 700 34px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.body { font: 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#111827; }
.code { font: 40px 'Consolas', 'Cascadia Mono', monospace; fill:#111827; }
.note { font: 700 31px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#065f46; }
.warn { font: 700 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#9a3412; }
</style>

<text x="80" y="90" class="title">重打包（Re-bundling）JAR 结构变化示意</text>
<rect x="80" y="160" width="1180" height="1120" rx="14" ry="14" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
<text x="120" y="220" class="label">改造前：多个独立 JAR（边界清晰）</text>
<rect x="110" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="140" y="320" class="code">project/lib/</text>
<text x="140" y="370" class="code">├─ spring-core-5.3.30.jar</text>
<text x="140" y="420" class="code">│  └─ org/springframework/...</text>
<text x="140" y="470" class="code">├─ jackson-databind-2.13.5.jar</text>
<text x="140" y="520" class="code">│  └─ com/fasterxml/jackson/...</text>
<text x="140" y="570" class="code">├─ guava-32.1.3.jar</text>
<text x="140" y="620" class="code">│  └─ com/google/common/...</text>
<text x="140" y="670" class="code">└─ app.jar</text>
<text x="140" y="720" class="code">   └─ com/company/app/...</text>
<text x="140" y="770" class="code"></text>
<text x="140" y="820" class="code">特点：一组件一工件，归属关系直观</text>
<rect x="1330" y="300" width="340" height="820" rx="14" ry="14" fill="#ecfeff" stroke="#334155" stroke-width="2"/>
<text x="1382" y="370" class="label">重打包动作</text>
<text x="1354" y="470" class="body">- 使用 maven-shade-p</text>
<text x="1354" y="540" class="body">lugin</text>
<text x="1354" y="610" class="body">- 合并依赖 class/resou</text>
<text x="1354" y="680" class="body">rces</text>
<text x="1354" y="750" class="body">- 处理冲突文件与服务描述</text>
<text x="1354" y="820" class="body">- 生成 fat-jar / ube</text>
<text x="1354" y="890" class="body">r-jar</text>
<line x1="1260" y1="720" x2="1330" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1330,720 1306,707 1306,733" fill="#0f172a"/>
<line x1="1670" y1="720" x2="1740" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1740,720 1716,707 1716,733" fill="#0f172a"/>
<rect x="1740" y="160" width="1180" height="1120" rx="14" ry="14" fill="#f0fdf4" stroke="#334155" stroke-width="2"/>
<text x="1780" y="220" class="label">改造后：单一 uber-jar（边界隐式）</text>
<rect x="1770" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="1800" y="320" class="code">app-all.jar</text>
<text x="1800" y="370" class="code">├─ com/company/app/...</text>
<text x="1800" y="420" class="code">├─ org/springframework/...</text>
<text x="1800" y="470" class="code">├─ com/fasterxml/jackson/...</text>
<text x="1800" y="520" class="code">├─ com/google/common/...</text>
<text x="1800" y="570" class="code">└─ META-INF/services/...</text>
<text x="1800" y="620" class="code"></text>
<text x="1800" y="670" class="code">结果：交付简化，但组件边界不再显式可见</text>
<text x="1800" y="720" class="code">扫描时需要在混合容器中重建组件归属</text>
<text x="80" y="1430" class="note">结论：结构由“多工件”收敛为“单工件”，漏洞归属与解释复杂度上升。</text>
</svg>