<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500">
<rect x="0" y="0" width="100%" height="100%" fill="#f8fafc"/>

<style>
.title { font: 700 52px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.label { font: 700 34px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#0f172a; }
.body { font: 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#111827; }
.code { font: 40px 'Consolas', 'Cascadia Mono', monospace; fill:#111827; }
.note { font: 700 31px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#065f46; }
.warn { font: 700 30px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill:#9a3412; }
</style>

<text x="80" y="90" class="title">重定位/重命名包路径（Relocation）变化示意</text>
<rect x="80" y="160" width="1180" height="1120" rx="14" ry="14" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
<text x="120" y="220" class="label">改造前：原始命名空间</text>
<rect x="110" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="140" y="330" class="code">类名：com.lib.crypto.Parser</text>
<text x="140" y="382" class="code">方法签名：&lt;com.lib.crypto.Parser: int parse(byte[])&gt;</text>
<text x="140" y="434" class="code">调用点：invokevirtual com/lib/crypto/Parser.parse:([B)I</text>
<text x="140" y="486" class="code"></text>
<text x="140" y="538" class="code">常量池引用：</text>
<text x="140" y="590" class="code">  #17 = Class com/lib/crypto/Parser</text>
<text x="140" y="642" class="code">  #31 = NameAndType parse:([B)I</text>
<rect x="1330" y="300" width="340" height="820" rx="14" ry="14" fill="#ecfeff" stroke="#334155" stroke-width="2"/>
<text x="1368" y="370" class="label">重定位动作</text>
<text x="1350" y="470" class="body">- 应用 relocation 规则</text>
<text x="1350" y="540" class="body">  com.lib.* -&gt; vendo</text>
<text x="1350" y="610" class="body">r.shadow.com.lib.*</text>
<text x="1350" y="680" class="body">- 重写类路径与内部引用</text>
<text x="1350" y="750" class="body">- 更新常量池类型符号</text>
<line x1="1260" y1="720" x2="1330" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1330,720 1306,707 1306,733" fill="#0f172a"/>
<line x1="1670" y1="720" x2="1740" y2="720" stroke="#0f172a" stroke-width="5"/>
<polygon points="1740,720 1716,707 1716,733" fill="#0f172a"/>
<rect x="1740" y="160" width="1180" height="1120" rx="14" ry="14" fill="#f0fdf4" stroke="#334155" stroke-width="2"/>
<text x="1780" y="220" class="label">改造后：迁移后的命名空间</text>
<rect x="1770" y="240" width="1120" height="980" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="1800" y="330" class="code">类名：vendor.shadow.com.lib.crypto.Parser</text>
<text x="1800" y="382" class="code">方法签名：&lt;vendor.shadow.com.lib.crypto.Parser: int parse(byt</text>
<text x="1800" y="434" class="code">e[])&gt;</text>
<text x="1800" y="486" class="code">调用点：invokevirtual vendor/shadow/com/lib/crypto/Parser.pa</text>
<text x="1800" y="538" class="code">rse:([B)I</text>
<text x="1800" y="590" class="code"></text>
<text x="1800" y="642" class="code">变化本质：名称层系统性改写，</text>
<text x="1800" y="694" class="code">功能语义可能保持一致</text>
<text x="80" y="1430" class="warn">结论：基于 FQN 的匹配链路失效，需引入非限定名匹配与上下文校验。</text>
</svg>